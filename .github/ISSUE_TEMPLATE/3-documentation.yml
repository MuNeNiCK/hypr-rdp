name: Documentation improvement
description: Report missing, unclear, or incorrect documentation.
labels: [documentation]
body:
  - type: input
    id: location
    attributes:
      label: Page or topic
      description: Link to the page or name the topic that needs documentation.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What needs improvement?
      description: Describe what is missing, unclear, or incorrect and what you need to understand.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
